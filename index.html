<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="AURA 2.0 — An accessible AI assistant designed to make technology easier for everyone."
    >

    <title>AURA 2.0 | Accessibility Assistant</title>

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <div class="app-shell">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-logo">A</div>

                <div class="brand-text">
                    <h1>AURA</h1>
                    <span>ACCESSIBILITY AI</span>
                </div>
            </div>

            <div class="sidebar-label">WORKSPACE</div>

            <nav class="navigation" aria-label="Main navigation">
                <button class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </button>

                <button class="nav-item" data-page="assistant">
                    <span class="nav-icon">✦</span>
                    <span>AI Assistant</span>
                </button>

                <button class="nav-item" data-page="voice">
                    <span class="nav-icon">♫</span>
                    <span>Voice Assistant</span>
                </button>

                <button class="nav-item" data-page="gestures">
                    <span class="nav-icon">☝</span>
                    <span>Gesture Controls</span>
                </button>

                <button class="nav-item" data-page="accessibility">
                    <span class="nav-icon">◎</span>
                    <span>Accessibility</span>
                </button>

                <button class="nav-item" data-page="activity">
                    <span class="nav-icon">◷</span>
                    <span>Activity</span>
                </button>
            </nav>

            <div class="sidebar-label secondary-label">PERSONAL</div>

            <nav class="navigation" aria-label="Personal navigation">
                <button class="nav-item" data-page="profile">
                    <span class="nav-icon">♙</span>
                    <span>My Profile</span>
                </button>

                <button class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <div class="system-status">
                    <span class="status-dot"></span>

                    <div>
                        <strong>AURA is ready</strong>
                        <small>Local interface active</small>
                    </div>
                </div>

                <button class="profile-mini" data-page="profile">
                    <div class="avatar" id="sidebarAvatar">U</div>

                    <div class="profile-mini-text">
                        <strong id="sidebarUserName">User</strong>
                        <small>Personal workspace</small>
                    </div>

                    <span class="profile-arrow">›</span>
                </button>
            </div>
        </aside>

        <!-- Main application -->
        <main class="main-area">

            <header class="topbar">
                <div class="topbar-left">
                    <button
                        class="icon-button menu-button"
                        id="menuToggle"
                        aria-label="Toggle navigation"
                    >
                        ☰
                    </button>

                    <div>
                        <div class="breadcrumb">AURA / <span id="breadcrumbPage">Dashboard</span></div>
                        <h2 id="pageTitle">Dashboard</h2>
                    </div>
                </div>

                <div class="topbar-right">
                    <div class="date-label" id="currentDate"></div>

                    <button
                        class="icon-button"
                        id="topbarProfile"
                        aria-label="Open profile"
                    >
                        ♙
                    </button>
                </div>
            </header>

            <section class="page-container" id="pageContent">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading AURA...</p>
                </div>
            </section>

            <footer class="app-footer">
                <span>© 2026 AURA 2.0</span>
                <span>Designed with accessibility in mind</span>
            </footer>

        </main>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
